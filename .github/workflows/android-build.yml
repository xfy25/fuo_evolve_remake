name: Android Build

"on":
  workflow_dispatch:
  # Also runs on branch pushes so the workflow gets registered by GitHub and so
  # a broken build is caught before it reaches the default branch. Narrow the
  # trigger (or drop it) once dispatch-only behaviour is preferred again.
  push:
    branches:
      - feat/melox-quality-tiers
    paths:
      - "androidApp/**"
      - "shared/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "core/**"
      - "persistence/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-arm64-v8a:
    name: Build arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # versionCode is derived from `git merge-base HEAD master` in
      # androidApp/build.gradle.kts. A fresh fork may only have `main`, so fall
      # back instead of failing the step; Gradle then falls back to counting HEAD.
      - name: Prepare Git refs for Gradle versioning
        run: |
          if git show-ref --verify --quiet refs/heads/master; then
            exit 0
          fi
          for candidate in origin/master origin/main; do
            if git show-ref --verify --quiet "refs/remotes/$candidate"; then
              git branch master "$candidate"
              echo "Using $candidate as the versionCode base."
              exit 0
            fi
          done
          echo "::warning::Neither origin/master nor origin/main exists; versionCode falls back to the HEAD commit count."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Build arm64-v8a debug APK
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          --stacktrace
          :androidApp:assembleDebug
          -Pfuoevolve.abis=arm64-v8a

      - name: Verify a single APK was produced
        run: |
          set -euo pipefail
          mapfile -t apks < <(compgen -G "androidApp/build/outputs/apk/debug/*.apk" || true)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one debug APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          echo "APK: ${apks[0]}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-arm64-v8a-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          archive: false
          if-no-files-found: error
