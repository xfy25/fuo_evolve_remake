name: Android Build

"on":
  workflow_dispatch:
  # Also runs on branch pushes so the workflow gets registered by GitHub and so
  # a broken build is caught before it reaches the default branch. Narrow the
  # trigger (or drop it) once dispatch-only behaviour is preferred again.
  push:
    branches:
      - feat/melox-quality-tiers
    paths:
      - "androidApp/**"
      - "shared/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "core/**"
      - "persistence/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-arm64-v8a:
    name: Build arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # versionCode is derived from `git merge-base HEAD master` in
      # androidApp/build.gradle.kts. A fresh fork may only have `main`, so fall
      # back instead of failing the step; Gradle then falls back to counting HEAD.
      - name: Prepare Git refs for Gradle versioning
        run: |
          if git show-ref --verify --quiet refs/heads/master; then
            exit 0
          fi
          for candidate in origin/master origin/main; do
            if git show-ref --verify --quiet "refs/remotes/$candidate"; then
              git branch master "$candidate"
              echo "Using $candidate as the versionCode base."
              exit 0
            fi
          done
          echo "::warning::Neither origin/master nor origin/main exists; versionCode falls back to the HEAD commit count."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      # Debug APKs are signed with ~/.android/debug.keystore, which AGP creates
      # with a fresh random key the first time it is needed. Runners are
      # ephemeral, so without this cache every build gets a different signature:
      # Android then refuses in-place upgrades, and uninstalling also deletes the
      # Android Keystore entry that encrypts the provider login cookies. Caching
      # the keystore keeps the signature stable so APKs upgrade in place and the
      # login survives.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Report debug signing fingerprint
        run: |
          keystore="$HOME/.android/debug.keystore"
          if [ -f "$keystore" ]; then
            keytool -list -v -keystore "$keystore" -storepass android \
              -alias androiddebugkey 2>/dev/null | grep -E 'SHA256:' || true
          else
            echo "::warning::No cached debug keystore; this run generates a new one and "
            echo "::warning::the resulting APK will NOT install over existing builds."
          fi

      - name: Build arm64-v8a debug APK
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          --stacktrace
          :androidApp:assembleDebug
          -Pfuoevolve.abis=arm64-v8a

      - name: Verify a single APK was produced
        run: |
          set -euo pipefail
          mapfile -t apks < <(compgen -G "androidApp/build/outputs/apk/debug/*.apk" || true)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one debug APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          echo "APK: ${apks[0]}"
          # Print the signer so a keystore rotation (which silently breaks
          # in-place upgrades) is visible in the log.
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner=""
          if [ -n "$sdk" ]; then
            apksigner=$(ls -d "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs "${apks[0]}" | grep -i 'SHA-256' || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-arm64-v8a-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          archive: false
          if-no-files-found: error
